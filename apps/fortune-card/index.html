<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#eee8f3"><title>오늘의 작은 운세</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eee8f3;color:#50435f;font-family:'Malgun Gothic',system-ui,sans-serif}main{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px 24px;text-align:center;background:radial-gradient(ellipse at 50% 40%,#faf4f4,#e8e0f0)}.eyebrow{font:12px Georgia,serif;letter-spacing:.22em;color:#9583a5;margin:0 0 14px}h1{font-size:25px;font-weight:500;margin:0 0 30px}.card{width:min(100%,320px);min-height:350px;background:#fffaf2;border:1px solid #d9c6a7;border-radius:21px;padding:32px;box-shadow:0 15px 40px #67547e14;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;outline:1px solid #e8dcc7;outline-offset:-10px}.symbol{font-size:45px;color:#b79a66;margin-bottom:20px;line-height:1.3}h2{font-size:24px;font-weight:500;margin:0 0 18px;letter-spacing:-.04em}#message{font-size:15px;line-height:1.95;margin:0;color:#897b91;word-break:keep-all}.label{position:absolute;bottom:20px;color:#b7a68a;font:11px Georgia,serif;letter-spacing:.15em}button{margin-top:28px;border:0;border-radius:999px;padding:16px 32px;background:#7e668e;color:#fffaf5;font:600 16px 'Malgun Gothic',system-ui,sans-serif;cursor:pointer;transition:transform .15s,background .2s}button:hover{background:#6b537d}button:active{transform:scale(.96)}button:focus-visible{outline:3px solid #b69ac9;outline-offset:5px}.note{font-size:12px;color:#a291aa;margin:20px 0 0}@media(prefers-reduced-motion:reduce){button{transition:none}}
.card-scene{width:min(100%,320px);height:370px;perspective:1000px}
.card{width:100%;height:100%;min-height:0;padding:0;background:transparent;border:0;outline:0;box-shadow:none;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.4,0,.2,1)}
.card.revealed{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;background:#fffaf2;border:1px solid #d9c6a7;border-radius:21px;box-shadow:0 15px 40px #67547e20;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face::after{content:'';position:absolute;inset:10px;border:1px solid #d8c4a280;border-radius:12px;pointer-events:none}
.card-front{transform:rotateY(180deg)}
.card-back{background:repeating-linear-gradient(45deg,#76608718 0 1px,transparent 1px 15px),repeating-linear-gradient(-45deg,#76608718 0 1px,transparent 1px 15px),#554363;color:#e9d8ad}
.back-emblem{font:80px Georgia,serif;width:150px;height:150px;display:grid;place-items:center;border:1px solid #cfb887;border-radius:50%;box-shadow:0 0 0 8px #cfb88715}
.back-caption{font:11px Georgia,serif;letter-spacing:.2em;margin:28px 0 0;color:#decca9}
button:disabled{opacity:.6;cursor:wait}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
.card-scene.shivering{animation:shiver .65s ease-in-out}
@keyframes shiver{0%,100%{transform:translateX(0) rotate(0)}15%,45%,75%{transform:translateX(-3px) rotate(-1deg)}30%,60%,90%{transform:translateX(3px) rotate(1deg)}}
@media(prefers-reduced-motion:reduce){.card-scene.shivering{animation:none}}
</style>
</head>
<body><main>
<p class="eyebrow">A LITTLE LUCK FOR TODAY</p><h1>오늘의 작은 운세</h1>
<div class="card-scene">
<article class="card" id="card">
<div class="face card-back" id="card-back" aria-label="운세 카드 뒷면"><div class="back-emblem" aria-hidden="true">☾</div><p class="back-caption">A LITTLE MYSTERY</p></div>
<div class="face card-front" id="card-front" aria-hidden="true">
<div class="symbol" id="symbol" aria-hidden="true">✧</div>
<h2 id="heading">어떤 하루가 올까요?</h2>
<p id="message">잠시 숨을 고르고,<br>오늘을 위한 카드 한 장을 뽑아 보세요.</p>
<span class="label" aria-hidden="true">YOUR DAILY FORTUNE</span>
</div></article></div>
<p id="announcement" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);"></p>
<button id="draw" type="button">오늘의 운세 뽑기</button>
<p class="note">가볍게 즐기는, 오늘을 위한 작은 힌트.</p>
</main><script>
const fortunes=[
 {title:'뜻밖의 반가움',message:'평범한 순간에 작은 기쁨이 숨어 있어요. 오늘은 주변을 한 번 더 둘러보세요.',symbol:'✧'},
 {title:'한 걸음의 힘',message:'미뤄 둔 일을 작게 시작해 보세요. 첫걸음이 생각보다 가벼울 거예요.',symbol:'☀'},
 {title:'다정함이 돌아오는 날',message:'따뜻한 말 한마디를 먼저 건네 보세요. 기분 좋은 대화가 이어질지도 몰라요.',symbol:'♡'},
 {title:'천천히, 좋은 방향으로',message:'서두르지 않아도 괜찮아요. 오늘은 나만의 속도로 가는 것이 행운의 열쇠예요.',symbol:'☾'},
 {title:'새로운 발견',message:'익숙한 길에서 살짝 벗어나 보세요. 작은 변화가 새로운 생각을 데려올 거예요.',symbol:'✦'},
 {title:'쉬어 가는 행운',message:'잠깐의 휴식이 하루를 바꿀 수 있어요. 좋아하는 차 한 잔과 여유를 챙겨 보세요.',symbol:'❀'},
 {title:'마음이 통하는 순간',message:'떠오르는 사람이 있다면 안부를 전해 보세요. 짧은 인사가 반가운 연결이 될 거예요.',symbol:'✉'},
 {title:'작은 성취의 날',message:'오늘 해낸 일을 하나만 떠올려 보세요. 작아 보이는 성취도 충분히 빛나고 있어요.',symbol:'☆'}
];
const draw=document.getElementById('draw');
const card=document.getElementById('card');
const front=document.getElementById('card-front');
const back=document.getElementById('card-back');
let cardAudio;
function cardSound(){
 try{
  if(!cardAudio || cardAudio.state!=='running')return;
  const ctx=cardAudio, time=ctx.currentTime;
  const buffer=ctx.createBuffer(1,Math.floor(ctx.sampleRate*.2),ctx.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1);
  const source=ctx.createBufferSource();source.buffer=buffer;
  const filter=ctx.createBiquadFilter();filter.type='bandpass';filter.frequency.value=2200;filter.Q.value=.6;
  const gain=ctx.createGain();gain.gain.setValueAtTime(0,time);
  gain.gain.linearRampToValueAtTime(.09,time+.025);
  gain.gain.exponentialRampToValueAtTime(.001,time+.19);
  source.connect(filter);filter.connect(gain);gain.connect(ctx.destination);
  source.start();source.stop(time+.2);
  source.onended=()=>{source.disconnect();filter.disconnect();gain.disconnect();};
 }catch{}
}
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
draw.addEventListener('click',async()=>{
 draw.disabled=true;
 draw.textContent='카드를 고르는 중…';
 try{const Audio=window.AudioContext||window.webkitAudioContext;if(Audio){cardAudio ||= new Audio();await cardAudio.resume();}}catch{}
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(card.classList.contains('revealed')){
  front.setAttribute('aria-hidden','true');back.removeAttribute('aria-hidden');
  card.classList.remove('revealed');
  await wait(reduced?0:820);
 }
 const scene=document.querySelector('.card-scene');
 scene.classList.add('shivering');
 await wait(700);
 scene.classList.remove('shivering');
 const fortune=fortunes[Math.floor(Math.random()*fortunes.length)];
 document.getElementById('heading').textContent=fortune.title;
 document.getElementById('message').textContent=fortune.message;
 document.getElementById('symbol').textContent=fortune.symbol;
 cardSound();
 card.classList.add('revealed');
 await wait(reduced?0:820);
 back.setAttribute('aria-hidden','true');front.removeAttribute('aria-hidden');
 document.getElementById('announcement').textContent=fortune.title+'。'+fortune.message;
 draw.textContent='한 장 더 뽑기';
 draw.disabled=false;
});</script></body></html>
