<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#171b2b"><title>오늘의 끝, 한 번의 숨</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171b2b;color:#cec9d8;font-family:'Malgun Gothic',system-ui,sans-serif}main{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:35px 22px;text-align:center;background:radial-gradient(ellipse at 50% 42%,#24283c,#171b2b 72%)}.eyebrow{font:11px Georgia,serif;letter-spacing:.22em;color:#777d94;margin:0 0 16px}h1{font-size:24px;font-weight:400;letter-spacing:-.04em;margin:0 0 12px}.intro{font-size:12px;color:#858b9f;line-height:1.9;margin:0}.breathing-space{position:relative;display:grid;place-items:center;width:min(80vw,330px);height:300px;margin:10px 0 0}.halo{position:absolute;width:270px;height:270px;border-radius:50%;border:1px solid #c6bada0d}.orb{position:absolute;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#b6a9c1,#8c819f 58%,#6d6a89);box-shadow:0 0 55px #b5a3cd12,inset 0 0 25px #ddd2e115;transform:scale(.7);opacity:.82;will-change:transform}.orb::after{content:'';position:absolute;inset:18px;border:1px solid #d6cbe314;border-radius:50%}.orb-copy{position:relative;pointer-events:none}.orb-copy span{display:block;font-size:11px;letter-spacing:.1em;color:#e6deebaa;margin-bottom:8px}#remaining{font:300 39px/1.2 Georgia,serif;color:#e5dce9;min-height:48px;font-variant-numeric:tabular-nums}#cue{font-size:24px;font-weight:400;letter-spacing:-.04em;margin:0 0 12px;color:#d6cedd;min-height:36px}#description{font-size:13px;color:#888fa3;margin:0 0 28px;line-height:1.9;min-height:25px}.controls{display:flex;gap:10px;justify-content:center}button{border:1px solid #59586d;border-radius:999px;background:#6c637c;color:#e9e1ed;padding:14px 32px;font:14px 'Malgun Gothic',system-ui,sans-serif;cursor:pointer;transition:background .2s}button:hover{background:#7c718a}.secondary{background:transparent;color:#9398ad;border-color:#363c50;padding-inline:23px}.secondary:hover{background:#2b3043}button:focus-visible{outline:2px solid #b9a6c7;outline-offset:5px}.rhythm{display:flex;gap:18px;margin:27px 0 12px;padding:0;list-style:none;color:#646d85;font-size:11px}.rhythm li{transition:color .4s}.rhythm li.current{color:#b3a9c1}.footer{font-size:11px;line-height:1.9;color:#626b81;margin:0}.rounds{font-size:11px;color:#7b8298;margin:14px 0 0;min-height:20px}@media(max-width:430px){h1{font-size:22px}.breathing-space{height:270px}.orb{width:210px;height:210px}.halo{width:245px;height:245px}.rhythm{gap:14px}}@media(prefers-reduced-motion:reduce){button,.rhythm li{transition:none}.orb{will-change:auto}}
.sound-toggle{margin-top:20px;padding:8px 16px;border-color:#3d4257;background:transparent;color:#9896ab;font-size:11px}.sound-toggle:hover{background:#2b3043}.sound-toggle[aria-pressed=false]{color:#69728a}.sound-hint{margin:9px 0 0;color:#697188;font-size:10px;letter-spacing:.05em}
</style>
</head><body><main>
<p class="eyebrow">A SOFT LANDING FOR THE NIGHT</p><h1>오늘의 끝, 한 번의 숨</h1><p class="intro">하루를 잠시 내려놓고,<br>편안한 만큼만 천천히 따라가 보세요.</p>
<div class="breathing-space" aria-hidden="true"><div class="halo"></div><div class="orb" id="orb"></div><div class="orb-copy"><span id="phase-name">고요한 시간</span><div id="remaining">☾</div></div></div>
<h2 id="cue" role="status" aria-live="polite" aria-atomic="true">편안하게 앉거나 누워요</h2><p id="description">준비되면 시작해 주세요.</p>
<div class="controls"><button id="start" type="button">호흡 시작</button><button id="reset" class="secondary" type="button">처음으로</button></div>
<button id="sound" class="sound-toggle" type="button" aria-pressed="true" aria-label="호흡 안내 소리 켜짐">소리 켜짐</button><p class="sound-hint" id="sound-hint">들이쉬기 ↗ · 멈춤 — · 내쉬기 ↘</p>
<ol class="rhythm" aria-label="호흡 순서"><li id="phase-0">들이쉬기 4초</li><li id="phase-1">잠깐 멈춤 7초</li><li id="phase-2">내쉬기 8초</li></ol>
<p class="footer">박자보다 내 몸의 편안함이 먼저예요.<br>언제든 쉬어 가도 괜찮아요.</p><p class="rounds" id="rounds">아직 서두를 일은 없어요.</p>
</main><script>
const phases=[
 {name:'들이쉬기',seconds:4,cue:'천천히 들이쉬어요',description:'빛이 커지는 동안, 편안하게 숨을 들여요.'},
 {name:'잠깐 멈춤',seconds:7,cue:'잠깐 머물러요',description:'힘을 주지 않고, 잠시 쉬어 가요.'},
 {name:'내쉬기',seconds:8,cue:'길게 내쉬어요',description:'빛이 작아지는 동안, 부드럽게 숨을 내보내요.'}
];
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
const orb=document.getElementById('orb'),start=document.getElementById('start');
let running=false,begun=false,index=0,elapsed=0,completed=0,lastTime;
const soundButton=document.getElementById('sound');
let soundEnabled=true,audioContext,voices=[];
function stopAudio(){
 if(!audioContext)return;
 const time=audioContext.currentTime;
 for(const voice of voices){
  try{voice.gain.gain.cancelScheduledValues(time);voice.gain.gain.setTargetAtTime(0,time,.012);voice.oscillator.stop(time+.05);}catch{}
 }
 voices=[];
}
async function unlockAudio(){
 if(!soundEnabled)return false;
 try{
  const Audio=window.AudioContext||window.webkitAudioContext;
  if(!Audio)throw new Error('No audio');
  audioContext ||= new Audio();await audioContext.resume();
  return audioContext.state==='running';
 }catch{document.getElementById('sound-hint').textContent='이 브라우저에서는 소리를 재생할 수 없어요. 화면 안내는 계속됩니다.';return false;}
}
function playCue(phaseIndex){
 if(!soundEnabled||!running||!audioContext||audioContext.state!=='running')return;
 stopAudio();
 const notes=[[293.66,369.99],[261.63],[329.63,246.94]][phaseIndex];
 const now=audioContext.currentTime;
 notes.forEach((frequency,i)=>{
  const oscillator=audioContext.createOscillator(),gain=audioContext.createGain(),time=now+i*.28;
  oscillator.type='sine';oscillator.frequency.setValueAtTime(frequency,time);
  gain.gain.setValueAtTime(0,time);gain.gain.linearRampToValueAtTime(.045,time+.12);gain.gain.exponentialRampToValueAtTime(.0001,time+1.05);
  oscillator.connect(gain);gain.connect(audioContext.destination);
  const voice={oscillator,gain};voices.push(voice);
  oscillator.start(time);oscillator.stop(time+1.1);
  oscillator.onended=()=>{oscillator.disconnect();gain.disconnect();voices=voices.filter(item=>item!==voice);};
 });
}
soundButton.addEventListener('click',async()=>{
 soundEnabled=!soundEnabled;
 soundButton.setAttribute('aria-pressed',String(soundEnabled));soundButton.setAttribute('aria-label','호흡 안내 소리 '+(soundEnabled?'켜짐':'꺼짐'));soundButton.textContent=soundEnabled?'소리 켜짐':'소리 꺼짐';
 if(!soundEnabled)stopAudio();else if(await unlockAudio()){if(running)playCue(index);}
});
function announce(withSound=true){
 const phase=phases[index];document.getElementById('cue').textContent=phase.cue;document.getElementById('description').textContent=phase.description;
 document.getElementById('phase-name').textContent=phase.name;
 for(let i=0;i<3;i++){document.getElementById('phase-'+i).classList.toggle('current',i===index);}
 if(withSound)playCue(index);
}
function render(){
 const phase=phases[index],progress=Math.min(1,elapsed/phase.seconds),smooth=progress*progress*(3-2*progress);
 const size=index===0?.7+.3*smooth:index===1?1:1-.3*smooth;
 orb.style.transform='scale('+(reduced.matches?.85:size)+')';
 document.getElementById('remaining').textContent=begun?Math.max(1,Math.ceil(phase.seconds-elapsed)):'☾';
 document.getElementById('rounds').textContent=completed?'함께한 호흡 '+completed+'번':'아직 서두를 일은 없어요.';
}
function pause(){if(!running)return;running=false;stopAudio();lastTime=undefined;start.textContent='이어서 호흡';document.getElementById('cue').textContent='잠시 쉬어가요';document.getElementById('description').textContent='편안해지면, 멈춘 곳에서 이어갈 수 있어요.';}
start.addEventListener('click',()=>{
 if(running){pause();return;}
 running=true;begun=true;lastTime=undefined;start.textContent='잠시 쉬기';announce(false);render();
 unlockAudio().then(ok=>{if(ok&&running)playCue(index);});
});
document.getElementById('reset').addEventListener('click',()=>{
 stopAudio();running=false;begun=false;index=0;elapsed=0;completed=0;lastTime=undefined;
 start.textContent='호흡 시작';document.getElementById('cue').textContent='편안하게 앉거나 누워요';document.getElementById('description').textContent='준비되면 시작해 주세요.';document.getElementById('phase-name').textContent='고요한 시간';
 for(let i=0;i<3;i++)document.getElementById('phase-'+i).classList.remove('current');render();
});
function frame(time){
 if(running){
  const delta=lastTime===undefined?0:Math.max(0,(time-lastTime)/1000);lastTime=time;elapsed+=delta;
  // Time-based phases remain accurate when the screen's frame rate changes.
  let changed=false;
  while(elapsed>=phases[index].seconds){elapsed-=phases[index].seconds;index++;if(index===phases.length){index=0;completed++;}changed=true;}
  if(changed)announce();render();
 }
 requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
reduced.addEventListener('change',render);
render();requestAnimationFrame(frame);
</script></body></html>
