<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f1e8"><title>나의 작은 화분</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f1e8;color:#53604b;font-family:'Malgun Gothic',system-ui,sans-serif}main{width:min(100% - 40px,500px);margin:auto;padding:40px 0;text-align:center}.eyebrow{font:11px Georgia,serif;letter-spacing:.2em;color:#a2a88e}h1{font-size:28px;font-weight:500;letter-spacing:-.05em;margin:14px 0 10px}.intro{font-size:13px;color:#99a087;line-height:1.8;margin:0 0 24px}.garden{height:360px;display:grid;place-items:center;border-radius:28px;background:#e9efdf;position:relative;overflow:hidden}.garden svg{width:280px;height:335px;overflow:visible}#growth-art{transform-origin:150px 245px}.watering #growth-art{animation:sway .8s ease-in-out}.drop{opacity:0}.watering .drop{animation:rain .65s ease-in both;animation-delay:var(--delay,0s)}.growth{padding:23px 22px;background:#fffaf1;border:1px solid #e3e3d1;border-radius:18px;margin-top:18px}.growth-head{display:flex;justify-content:space-between;gap:15px;font-size:14px;align-items:center}.growth-head strong{font-weight:500}#percent{color:#94a17c;font-size:22px}.track{height:12px;border-radius:99px;overflow:hidden;background:#e9ecdc;margin:15px 0 10px}#progress{height:100%;width:0;background:#91ad78;border-radius:99px;transition:width .65s ease}#detail{font-size:12px;color:#9ba38b;margin:0;line-height:1.8}#water{width:100%;margin-top:18px;padding:17px;border:0;border-radius:14px;background:#819e74;color:#fffef3;font:600 16px 'Malgun Gothic',system-ui,sans-serif;cursor:pointer;touch-action:manipulation}#water:hover{background:#718f65}#water:active{transform:scale(.98)}#water:focus-visible{outline:3px solid #b4c4a4;outline-offset:4px}#water:disabled{opacity:.7;cursor:wait}#message{font-size:14px;line-height:1.9;min-height:48px;color:#859677;margin:19px 0 0}#save-status{font-size:11px;color:#a1947c;margin:8px 0 0;min-height:16px}.note{font-size:11px;color:#a7ad99;line-height:1.8;margin:14px 0 0}@keyframes sway{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}70%{transform:rotate(3deg)}}@keyframes rain{0%{opacity:0;transform:translateY(-15px)}20%{opacity:.8}90%{opacity:.6}100%{opacity:0;transform:translateY(110px)}}@media(prefers-reduced-motion:reduce){.watering #growth-art,.watering .drop{animation:none}#progress{transition:none}}
.garden{height:410px}.garden canvas{display:block;width:300px;height:400px;max-width:100%;object-fit:contain}.water-drops{position:absolute;top:50px;left:50%;transform:translateX(-50%);font-size:27px;color:#80aebe;opacity:0;pointer-events:none}.watering .water-drops{animation:water-fall .8s ease-in both}.watering canvas{animation:plant-sway .8s ease-in-out}@keyframes water-fall{0%{opacity:0;transform:translate(-50%,-10px)}25%,60%{opacity:.8}100%{opacity:0;transform:translate(-50%,75px)}}@keyframes plant-sway{0%,100%{transform:rotate(0)}30%{transform:rotate(-1deg)}70%{transform:rotate(1deg)}}@media(prefers-reduced-motion:reduce){.watering canvas,.watering .water-drops{animation:none}}#reset{display:block;margin:14px auto 0;border:1px solid #d6ddc9;background:transparent;color:#8c987d;border-radius:999px;padding:10px 18px;cursor:pointer;font:12px 'Malgun Gothic',system-ui,sans-serif}
</style></head><body><main>
<p class="eyebrow">A LITTLE GREEN, EVERY DAY</p><h1>나의 작은 화분</h1><p class="intro">물 한 모금, 작은 변화. 나만의 식물을 키워 보세요.</p>
<section class="garden" id="garden" aria-label="성장하는 화분 속 식물">
<canvas id="plant-picture" width="600" height="800" role="img" aria-label="성장하는 식물 그림"></canvas><div class="water-drops" aria-hidden="true">⋮ 💧 ⋮</div></section>
<section class="growth" aria-label="식물 성장 정도"><div class="growth-head"><strong id="stage">1단계 · 작은 새싹</strong><output id="percent">0%</output></div><div class="track" id="meter" role="progressbar" aria-label="성장 정도" aria-valuemin="0" aria-valuemax="100"><div id="progress"></div></div><p id="detail">물을 주면 조금씩 자라요.</p></section>
<button id="water" type="button">💧 물 주기</button><button id="reset" type="button">처음으로 되돌리기</button>
<p id="message" role="status" aria-live="polite">안녕, 작은 새싹! 첫 물을 주어 볼까요?</p>
<p class="note">물을 주면 한 번에 약 30초에 걸쳐 천천히 자라요.<br>이 브라우저에 자동 저장되어 다음에도 이어서 키울 수 있어요.</p><p id="save-status" role="status"></p>
</main><script>const key='little-plant-v1';
const total=20,secondsPerGrowth=30;
let state={growth:0,pending:0,waterings:0,updated:Date.now()};
try{
 const saved=JSON.parse(localStorage.getItem(key)||'null');
 if(saved&&Number.isFinite(saved.growth)&&Number.isFinite(saved.pending)&&Number.isFinite(saved.updated)){
  state.growth=Math.max(0,Math.min(total,saved.growth));state.pending=Math.max(0,Math.min(total-state.growth,saved.pending));state.updated=saved.updated;state.waterings=Math.max(0,Math.floor(saved.waterings||0));
 }else if(saved&&Number.isFinite(saved.watered)){
  state.growth=Math.max(0,Math.min(total,saved.watered));state.waterings=Math.max(0,Math.floor(saved.watered));
 }
}catch{}
const stages=[{name:'작은 새싹',at:0},{name:'잎이 자라요',at:4},{name:'줄기가 쑥쑥',at:9},{name:'꽃봉오리 준비',at:15},{name:'꽃봉오리가 올라왔어요',at:20}];
function stageFor(value){let index=0;stages.forEach((stage,i)=>{if(value+1e-7>=stage.at)index=i;});return index;}
const plantArt=[{"src":"art-c61ddbb8f7146b0e.webp","potWidth":712.0,"potCenter":511.5,"potTop":742.0,"bottom":1458.0},{"src":"art-c013b913391e0579.webp","potWidth":573.0,"potCenter":522.0,"potTop":715.0,"bottom":1410.0},{"src":"art-a3d97d5e766e0bf4.webp","potWidth":501.0,"potCenter":524.0,"potTop":740.0,"bottom":1458.0},{"src":"art-a01f7a520bd0eab0.webp","potWidth":549.0,"potCenter":512.0,"potTop":881.0,"bottom":1427.0},{"src":"art-a612f2e625ddd62f.webp","potWidth":575.0,"potCenter":522.0,"potTop":954.0,"bottom":1472.0}];
const picture=document.getElementById('plant-picture'),context=picture.getContext('2d');
const button=document.getElementById('water'),message=document.getElementById('message');
let artReady=false,animating=false,animationTimer;
const plantImages=[];
function paintStage(index,alpha){
 const data=plantArt[index],image=plantImages[index],scale=128/data.potWidth;
 context.save();context.globalAlpha=alpha;context.beginPath();context.rect(0,0,300,252);context.clip();
 context.drawImage(image,150-data.potCenter*scale,252-data.potTop*scale,image.naturalWidth*scale,image.naturalHeight*scale);context.restore();
}
function drawPlant(){
 if(!artReady)return;
 context.clearRect(0,0,600,800);context.save();context.scale(2,2);
 const index=stageFor(state.growth);
 // Ease between painted growth stages as the plant absorbs its water.
 if(index<4){const from=stages[index].at,to=stages[index+1].at;const phase=Math.max(0,Math.min(1,(state.growth-from)/(to-from)));paintStage(index,1);if(phase>0)paintStage(index+1,phase);}
 else paintStage(4,1);
 // Every stage uses precisely the same pot pixels, width, height and baseline.
 const base=plantArt[0],image=plantImages[0];
 const srcX=base.potCenter-base.potWidth/2,srcY=base.potTop;
 context.save();context.beginPath();context.rect(0,252,300,148);context.clip();
 context.drawImage(image,srcX,srcY,base.potWidth,base.bottom-srcY+1,86,252,128,118);context.restore();
 context.restore();picture.setAttribute('aria-label',stages[index].name+' · '+Math.round(state.growth/total*100)+'% 성장');
}
function advance(now=Date.now()){
 const elapsed=Math.max(0,(now-state.updated)/1000);
 const amount=Math.min(state.pending,elapsed/secondsPerGrowth,total-state.growth);
 state.growth=Math.min(total,state.growth+amount);state.pending=Math.max(0,state.pending-amount);
 if(state.pending<1e-7)state.pending=0;if(state.growth>total-1e-7)state.growth=total;
 state.updated=now;
}
function save(){try{localStorage.setItem(key,JSON.stringify(state));document.getElementById('save-status').textContent='';}catch{document.getElementById('save-status').textContent='현재 창에서는 키울 수 있지만 저장하지 못했어요.';}}
function render(){
 const index=stageFor(state.growth),percent=Math.floor(state.growth/total*100+1e-7),next=stages[index+1];
 drawPlant();document.getElementById('stage').textContent=(index+1)+'단계 · '+stages[index].name;
 document.getElementById('percent').textContent=percent+'%';document.getElementById('progress').style.width=state.growth/total*100+'%';
 const meter=document.getElementById('meter');meter.setAttribute('aria-valuenow',percent);meter.setAttribute('aria-valuetext',stages[index].name+' · '+percent+'%');
 const waiting=state.pending>0;
 document.getElementById('detail').textContent='물 준 횟수 '+state.waterings+'회 · '+(waiting?'천천히 물을 흡수하는 중 · 약 '+Math.ceil(state.pending*secondsPerGrowth)+'초 남았어요':next?'물을 주면 30초 동안 조금씩 자라요':'꽃봉오리가 올라왔어요!');
 button.disabled=animating||state.growth+state.pending>=total-1e-7;
 button.textContent=state.growth>=total?'꽃봉오리가 자랐어요':state.growth+state.pending>=total-1e-7?'충분히 물을 줬어요. 기다려 주세요':'💧 물 주기';
}
button.addEventListener('click',()=>{
 advance();if(animating||state.growth+state.pending>=total-1e-7){render();return;}
 state.pending=Math.min(total-state.growth,state.pending+1);state.waterings++;
 animating=true;const garden=document.getElementById('garden');garden.classList.remove('watering');void garden.offsetWidth;garden.classList.add('watering');
 message.textContent='물을 줬어요. 천천히 스며드는 동안 조금 기다려 주세요.';render();save();
 clearTimeout(animationTimer);animationTimer=setTimeout(()=>{animating=false;garden.classList.remove('watering');render();},850);
});
document.getElementById('reset').addEventListener('click',()=>{
 if(!confirm('식물의 성장과 물 준 횟수를 처음으로 되돌릴까요?'))return;
 clearTimeout(animationTimer);animating=false;document.getElementById('garden').classList.remove('watering');
 state={growth:0,pending:0,waterings:0,updated:Date.now()};render();save();message.textContent='작은 새싹부터 다시 시작해요. 첫 물을 주어 볼까요?';
});
function tick(){const before=stageFor(state.growth);advance();render();save();if(stageFor(state.growth)>before)message.textContent='기다림 끝에 '+stages[stageFor(state.growth)].name+'! 정성껏 돌봐 준 덕분이에요.';}
advance();render();save();
if(state.growth>0||state.pending>0)message.textContent=state.pending>0?'물을 천천히 흡수하며 자라고 있어요.':'다시 만나 반가워요. 이어서 키워 보세요.';
Promise.all(plantArt.map((data,index)=>new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>{plantImages[index]=image;resolve();};image.onerror=reject;image.src=data.src;}))).then(()=>{artReady=true;render();}).catch(()=>{document.getElementById('save-status').textContent='식물 그림을 불러오지 못했어요. 페이지를 다시 열어 주세요.';});
setInterval(tick,1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});
window.addEventListener('pagehide',()=>{advance();save();});
</script></body></html>
