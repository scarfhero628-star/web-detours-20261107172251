<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f1e7"><title>두부의 느긋한 산책</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f1e7;color:#56634c;font-family:'Malgun Gothic',system-ui,sans-serif}main{max-width:920px;margin:auto;padding:38px 22px}.eyebrow{font:11px Georgia,serif;letter-spacing:.2em;color:#a1a68a;margin:0 0 12px}header{text-align:center}h1{font-size:28px;font-weight:500;letter-spacing:-.05em;margin:0 0 12px}.intro{font-size:13px;color:#96a087;margin:0 0 26px;line-height:1.8}.scene{height:355px;position:relative;overflow:hidden;border-radius:28px;background:linear-gradient(#dcebe7 0%,#eaf0e0 66%,#d4dfbe 66%);border:1px solid #e0e3d3}.cloud{position:absolute;background:#fffcf2;border-radius:99px;width:95px;height:22px;top:65px;left:17%;opacity:.8}.cloud::before{content:'';position:absolute;border-radius:50%;width:44px;height:44px;background:inherit;left:18px;bottom:0}.cloud.second{top:100px;left:76%;transform:scale(.65)}.path{position:absolute;bottom:42px;height:43px;width:100%;background:#eadbb9;border-radius:50%;transform:scaleX(1.4)}.flower{position:absolute;bottom:30px;font-size:20px;color:#fbf3d0;opacity:.85}.flower.one{left:10%}.flower.two{right:12%;bottom:95px}.puppy{position:absolute;left:0;bottom:56px;width:180px;height:170px;padding:0;border:0;background:none;cursor:pointer;touch-action:manipulation}.puppy svg{width:100%;height:100%;overflow:visible}.dog-body{transform-origin:120px 120px}.tail{transform-origin:68px 98px;animation:wag 1.4s ease-in-out infinite}.leg{transform-box:fill-box;transform-origin:50% 10%}.walking .leg.a{animation:step .48s ease-in-out infinite alternate}.walking .leg.b{animation:step .48s ease-in-out infinite alternate-reverse}.walking .dog-body{animation:bob .48s ease-in-out infinite}.happy .tail{animation:wag .22s ease-in-out infinite}.happy .dog-body{animation:joy .6s ease-in-out infinite}.sniffing .head{transform-origin:162px 99px;animation:sniff .8s ease-in-out infinite}.heart{position:absolute;top:12px;left:65%;font-size:24px;color:#d99c98;opacity:0;pointer-events:none}.happy .heart{animation:hearts 1s ease-out infinite}.badge{position:absolute;top:20px;left:22px;background:#fffaf0bf;border:1px solid #dbe3cf;border-radius:99px;padding:9px 14px;font-size:12px;color:#809070}.message{text-align:center;font-size:15px;line-height:1.8;min-height:45px;margin:23px 0 14px;color:#839276}.stats{display:flex;justify-content:center;gap:45px;font-size:12px;color:#99a18b;margin-bottom:24px}.stats output{display:block;font-size:23px;color:#70825e;margin-top:5px;font-variant-numeric:tabular-nums}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.actions button{padding:16px 26px;border:0;border-radius:14px;cursor:pointer;font:600 15px 'Malgun Gothic',system-ui,sans-serif;color:#fffcf0;background:#81996c}.actions button.secondary{background:#e5d4ba;color:#817056}.actions button:active{transform:scale(.97)}button:focus-visible{outline:3px solid #c0ad83;outline-offset:5px}.note{text-align:center;font-size:11px;line-height:1.9;color:#a8ad98;margin:22px 0 0}@keyframes wag{0%,100%{transform:rotate(-13deg)}50%{transform:rotate(18deg)}}@keyframes step{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}@keyframes bob{50%{transform:translateY(-3px)}}@keyframes joy{50%{transform:translateY(-9px)}}@keyframes sniff{50%{transform:rotate(10deg) translateY(3px)}}@keyframes hearts{0%{opacity:0;transform:translateY(10px) scale(.7)}25%{opacity:.9}100%{opacity:0;transform:translateY(-25px) scale(1.05)}}@media(prefers-reduced-motion:reduce){.tail,.walking .leg,.walking .dog-body,.happy .tail,.happy .dog-body,.sniffing .head,.happy .heart{animation:none}}@media(max-width:500px){main{padding:29px 16px}.scene{height:310px}.puppy{width:150px;height:145px}.stats{gap:30px}h1{font-size:25px}}
.puppy canvas{display:block;width:100%;height:100%;transform-origin:50% 80%;pointer-events:none}.walking canvas{animation:bob .56s ease-in-out infinite}.happy canvas{animation:joy .6s ease-in-out infinite}.sniffing canvas{animation:sniff .8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.walking canvas,.happy canvas,.sniffing canvas{animation:none}}.eating canvas{animation:nibble .5s ease-in-out infinite}.actions button:disabled{opacity:.5;cursor:wait}@keyframes nibble{50%{transform:translateY(2px) rotate(.5deg)}}@media(prefers-reduced-motion:reduce){.eating canvas{animation:none}}</style></head><body><main>
<header><p class="eyebrow">LITTLE PAWS, A SLOW AFTERNOON</p><h1>두부의 느긋한 산책</h1><p class="intro">걷고, 킁킁 맡고, 잠깐 쉬어요. 두부와 함께 걸어 볼까요?</p></header>
<section class="scene" id="scene" aria-label="두부가 산책하는 공원"><span class="badge" id="badge">산책 준비</span><div class="cloud" aria-hidden="true"></div><div class="cloud second" aria-hidden="true"></div><div class="path" aria-hidden="true"></div><span class="flower one" aria-hidden="true">✿</span><span class="flower two" aria-hidden="true">✿</span>
<button id="puppy" class="puppy" type="button" aria-label="고양이 두부 쓰다듬기"><canvas id="dog-picture" width="480" height="400" aria-hidden="true"></canvas><span class="heart" aria-hidden="true">♥</span></button></section>
<p class="message" id="message" role="status" aria-live="polite">두부가 산책을 기다리고 있어요.</p>
<div class="stats"><div>함께 걸은 시간<output id="time">00:00</output></div><div>두부의 걸음<output id="steps">0걸음</output></div></div>
<div class="actions"><button id="walk" type="button">산책 시작</button><button class="secondary" id="feed" type="button">먹이 주기</button><button class="secondary" id="pet" type="button">♡ 쓰다듬기</button></div>
<p class="note">산책 중에는 가끔 멈춰 냄새를 맡고, 다시 걸어요.<br>고양이를 직접 눌러도 쓰다듬을 수 있어요.</p>
</main><script>
const scene=document.getElementById('scene'),puppy=document.getElementById('puppy'),walk=document.getElementById('walk'),message=document.getElementById('message');
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
let active=false,mode='idle',x=0,direction=1,lastTime,modeTime=0,walked=0,steps=0,previousMode='idle';
const frameData=["art-2ff215c24388504a.webp","art-5ac34676e02096e1.webp","art-9525097efe20508f.webp","art-2efe8fd8b4048290.webp","art-596c5d52b0c4a7b2.webp"];
const dogCanvas=document.getElementById('dog-picture'),dogContext=dogCanvas.getContext('2d');
const dogImages=[];let imagesReady=false,drawnFrame=-1;
const cycle=[0,2,1,2];
function drawDog(){
 if(!imagesReady)return;
 const index=mode==='eating'?4:mode==='happy'?3:mode==='walking'&&active&&!reduced.matches?cycle[Math.floor(walked/.14)%cycle.length]:2;
 if(index===drawnFrame)return;
 drawnFrame=index;dogContext.clearRect(0,0,480,400);
 dogContext.drawImage(dogImages[index],0,44,480,320);
}
walk.disabled=true;document.getElementById('feed').disabled=true;document.getElementById('pet').disabled=true;puppy.disabled=true;
Promise.all(frameData.map((src,i)=>new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>{dogImages[i]=image;resolve();};image.onerror=reject;image.src=src;}))).then(()=>{imagesReady=true;document.getElementById('feed').disabled=false;walk.disabled=false;document.getElementById('pet').disabled=false;puppy.disabled=false;drawDog();}).catch(()=>{message.textContent='고양이 그림을 불러오지 못했어요. 페이지를 새로고침해 주세요.';});

function setMode(next){mode=next;modeTime=0;puppy.classList.remove('walking','sniffing','happy','eating');if(['walking','sniffing','happy','eating'].includes(next))puppy.classList.add(next);const labels={idle:'산책 준비',walking:'사뿐사뿐 걷는 중',sniffing:'킁킁, 냄새 맡는 중',happy:'골골, 기분 좋아요!',resting:'잠깐 쉬는 중',eating:'냠냠, 먹이 먹는 중'};document.getElementById('badge').textContent=labels[next];}
function place(){const max=Math.max(0,scene.clientWidth-puppy.offsetWidth-16);x=Math.max(16,Math.min(max,x));puppy.style.left=(reduced.matches?Math.max(0,(scene.clientWidth-puppy.offsetWidth)/2):x)+'px';document.getElementById('dog-picture').style.scale=direction+' 1';}
walk.addEventListener('click',()=>{active=!active;walk.textContent=active?'잠시 쉬기':'다시 산책';setMode(active?'walking':'resting');message.textContent=active?'좋아! 두부가 가벼운 발걸음으로 걷기 시작해요.':'두부가 잠시 쉬고 있어요. 다시 걷고 싶으면 불러 주세요.';lastTime=undefined;});
function pet(){if(mode==='eating')return;if(mode!=='happy')previousMode=mode;setMode('happy');message.textContent='쓰담쓰담! 두부가 눈을 접고 골골거리며 좋아해요.';}
document.getElementById('pet').addEventListener('click',pet);puppy.addEventListener('click',pet);
document.getElementById('feed').addEventListener('click',()=>{
 if(!imagesReady||mode==='eating')return;
 previousMode=active?'walking':mode==='idle'?'idle':'resting';
 setMode('eating');walk.disabled=true;document.getElementById('feed').disabled=true;
 message.textContent='냠냠! 두부가 먹이를 맛있게 먹고 있어요.';
});
function frame(time){const dt=lastTime===undefined?0:Math.min((time-lastTime)/1000,.06);lastTime=time;modeTime+=dt;
 if(mode==='walking'&&active){
  walked+=dt;steps+=dt*2;x+=direction*dt*32;
  const max=scene.clientWidth-puppy.offsetWidth-16;if(x>=max){x=max;direction=-1;}else if(x<=16){x=16;direction=1;}
  if(modeTime>10+Math.sin(steps)*2){setMode('sniffing');message.textContent='킁킁… 이 풀밭에서 재미있는 냄새가 나나 봐요.';}
 }else if(mode==='sniffing'&&modeTime>2.8){setMode(active?'walking':'resting');message.textContent=active?'냄새 구경 끝! 두부가 다시 걷기 시작해요.':'잠시 쉬고 있어요.';}
 else if(mode==='eating'&&modeTime>2.4){
  setMode('happy');walk.disabled=false;document.getElementById('feed').disabled=false;
  message.textContent='맛있었어! 두부가 행복한 표정으로 웃어요.';
 }
 else if(mode==='happy'&&modeTime>2.2){setMode(active?'walking':previousMode==='idle'?'idle':'resting');message.textContent=active?'기분 좋은 두부가 다시 총총 걸어요.':'두부가 편안한 표정으로 곁에 있어요.';}
 drawDog();place();const seconds=Math.floor(walked);document.getElementById('time').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');document.getElementById('steps').textContent=Math.floor(steps)+'걸음';requestAnimationFrame(frame);
}
window.addEventListener('resize',place);document.addEventListener('visibilitychange',()=>{lastTime=undefined;});
setMode('idle');x=Math.max(16,(scene.clientWidth-puppy.offsetWidth)/2);place();requestAnimationFrame(frame);
</script></body></html>
