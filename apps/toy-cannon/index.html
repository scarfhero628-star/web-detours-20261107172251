<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>퐁! 장난감 대포</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f0e4;color:#354e49;font-family:'Malgun Gothic',system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:25px 22px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:18px}h1{font-size:27px;margin:0 0 6px;letter-spacing:-.04em}p{margin:0;color:#839087;font-size:13px}.score{background:#e3e9d9;border-radius:16px;padding:12px 19px;font-size:14px;white-space:nowrap}.score strong{font-size:22px;margin-left:8px}.stage{position:relative;overflow:hidden;border-radius:23px;border:5px solid #fffaf0;box-shadow:0 8px 25px #5e6f4915;background:#cce5e7}canvas{display:block;width:100%;aspect-ratio:1000/560}#loading{position:absolute;inset:0;display:grid;place-items:center;color:#567269;background:#e5eee1}.controls{display:grid;grid-template-columns:1fr 1fr auto;gap:30px;align-items:center;background:#fffaf0;padding:23px;border-radius:20px;margin-top:18px}label{display:block;font-size:14px;font-weight:600}label output{float:right;color:#ad6845;font-size:18px}input{width:100%;accent-color:#5e998b;cursor:pointer;margin:14px 0 0}button{border:0;border-radius:14px;padding:18px 30px;background:#d97b55;color:white;font:600 18px 'Malgun Gothic',system-ui,sans-serif;cursor:pointer;box-shadow:0 4px 0 #ab5c3c}button:disabled{opacity:.5;cursor:default}button:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #ab5c3c}button:focus-visible,input:focus-visible{outline:3px solid #adc0a2;outline-offset:4px}#status{min-height:30px;margin-top:18px;text-align:center;font-size:16px;font-weight:600;color:#648372}.tip{text-align:center;font-size:12px;margin-top:5px;color:#959e8e}@media(max-width:600px){main{padding:20px 12px}h1{font-size:22px}.controls{grid-template-columns:1fr 1fr;gap:18px;padding:18px}button{grid-column:1/-1;padding:14px}.score{padding:10px}header p{max-width:200px;font-size:12px}}
.history{margin-top:16px;padding:18px 23px;background:#fffaf0;border:1px solid #e8dfcd;border-radius:18px}.history-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.history h2{font-size:15px;margin:0}.legend{font-size:12px;color:#7c8d80}.legend b{color:#456f65}.legend span{color:#a2b3a5}table{width:100%;border-collapse:collapse;font-size:13px;text-align:left;font-variant-numeric:tabular-nums}th{font-weight:500;color:#8c9686;font-size:12px}td,th{padding:8px 5px;border-bottom:1px solid #eee7d9}tbody tr:first-child td{font-weight:600;color:#526f60}tbody tr:last-child td{border-bottom:0}.history-empty{font-size:13px;padding:12px 0;color:#969b8b}@media(max-width:600px){.history{padding:16px}.history-head{align-items:flex-start;flex-direction:column}}
.scoreboard{display:flex;gap:10px;flex-wrap:wrap}.celebration-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:18px}.celebration-actions[hidden]{display:none}.celebration-actions button{font-size:14px;padding:13px 19px;background:#659889;box-shadow:0 3px 0 #467665}.restart{display:block;margin:18px auto 0;background:transparent;color:#879581;box-shadow:none;font-size:12px;padding:8px 15px;border:1px solid #d8decd}
</style></head><body><main>
<header><div><h1>퐁! 장난감 대포</h1><p>각도와 힘을 맞춰, 빨간 표적을 향해!</p></div><div class="scoreboard"><div class="score">이번 표적 <strong id="attempts">0</strong> 회</div><div class="score">전체 명중 <strong id="total-hits">0</strong> 회</div></div></header>
<div class="stage"><canvas id="game" width="1000" height="560" role="img" aria-label="왼쪽 대포에서 포탄을 쏘아 오른쪽 표적을 맞히는 게임"></canvas><div id="loading" role="status">장난감을 꺼내는 중…</div></div>
<div class="controls"><label>각도 <output id="angle-value">45°</output><input id="angle" type="range" min="15" max="80" value="45" aria-label="발사 각도"></label><label>힘 <output id="power-value">70</output><input id="power" type="range" min="20" max="100" value="70" aria-label="발사 힘"></label><button id="fire" disabled>발사!</button></div>
<div class="celebration-actions" id="hit-actions" hidden><button id="same-target" type="button">같은 표적 다시 도전</button><button id="new-target" type="button">새 표적 도전</button></div>
<section class="history" aria-labelledby="history-title"><div class="history-head"><h2 id="history-title">발사 기록</h2><p class="legend"><b>● 현재 발</b> · <span>○ 직전 발</span></p></div><table aria-label="최근 세 발의 발사 기록"><thead><tr><th scope="col">시도</th><th scope="col">각도</th><th scope="col">힘</th><th scope="col">결과</th></tr></thead><tbody id="history-rows"></tbody></table><p class="history-empty" id="history-empty">첫 발을 쏘면 여기에 기록돼요.</p></section>
<p id="status" role="status" aria-live="polite">그림을 불러오고 있어요.</p><p class="tip">각도가 높으면 높이, 힘이 세면 멀리 날아가요. 점선은 처음 날아가는 방향이에요.</p>
<button id="restart" class="restart" type="button">처음부터 다시</button></main><script>
const assetData={"ball":"art-8a80fb137d1dc85c.webp","target":"art-241faf5910e7aec1.webp","cannon":"art-9380388629655b2f.webp","background":"art-7f6f23478fd311f4.webp"};
const images={};
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const angle=document.getElementById('angle'),power=document.getElementById('power'),fire=document.getElementById('fire'),status=document.getElementById('status');
const ground=458,origin={x:193,y:365},target={x:825,y:388,r:43};
let ready=false,flying=false,shot=null,attempts=0,lastTime,trail=[],won=false,previousShot=null,history=[];
function trajectory(a,p,t){const rad=a*Math.PI/180,speed=p*8;return {x:origin.x+speed*Math.cos(rad)*t,y:origin.y-speed*Math.sin(rad)*t+210*t*t};}
function segmentHit(a,b){const dx=b.x-a.x,dy=b.y-a.y;const length=dx*dx+dy*dy;const t=length?Math.max(0,Math.min(1,((target.x-a.x)*dx+(target.y-a.y)*dy)/length)):0;return Math.hypot(a.x+t*dx-target.x,a.y+t*dy-target.y)<=target.r+10;}
let totalHits=0,particles=[],shakeTime=0;
function updateScores(){document.getElementById('attempts').textContent=attempts;document.getElementById('total-hits').textContent=totalHits;}
function clearRound(){
 flying=false;won=false;shot=null;previousShot=null;trail=[];history=[];attempts=0;particles=[];shakeTime=0;lastTime=undefined;
 fire.disabled=!ready;angle.disabled=false;power.disabled=false;fire.textContent='발사!';document.getElementById('hit-actions').hidden=true;updateScores();renderHistory();
}
function relocateTarget(){
 const oldX=target.x;let nextX;
 do{nextX=600+Math.random()*280;}while(Math.abs(nextX-oldX)<90);
 clearRound();target.x=nextX;status.textContent='새 표적 도전! 이번 표적은 1번째 시도부터 시작해요.';
}
function celebrate(){
 shakeTime=.48;
 if(matchMedia('(prefers-reduced-motion: reduce)').matches){shakeTime=0;return;}
 particles=Array.from({length:24},()=>({x:target.x,y:target.y,vx:(Math.random()-.5)*220,vy:-60-Math.random()*150,life:1.4+Math.random()*.5,rotation:Math.random()*6,spin:(Math.random()-.5)*8,color:['#e8a06c','#8dbca6','#f5d48a','#f9f0d8'][Math.floor(Math.random()*4)]}));
}
function drawConfetti(){
 particles.forEach(p=>{ctx.save();ctx.globalAlpha=Math.min(1,p.life);ctx.translate(p.x,p.y);ctx.rotate(p.rotation);ctx.fillStyle=p.color;ctx.fillRect(-3,-5,6,10);ctx.restore();});
}
function missReason(){
 if(shot.x<target.x-target.r)return '표적보다 짧아요';
 const t=(target.x-origin.x)/(shot.power*8*Math.cos(shot.angle*Math.PI/180));
 return trajectory(shot.angle,shot.power,t).y<target.y-target.r?'표적 위로 넘어갔어요':'표적보다 멀리 갔어요';
}function renderHistory(){
 const rows=document.getElementById('history-rows');rows.replaceChildren();
 history.forEach(record=>{const row=document.createElement('tr');[record.number+'번째',record.angle+'°',record.power,record.result].forEach(value=>{const cell=document.createElement('td');cell.textContent=value;row.append(cell);});rows.append(row);});
 document.getElementById('history-empty').hidden=history.length>0;
}
function drawPath(points,faint){
 if(!points.length)return;
 ctx.save();ctx.globalAlpha=faint?.32:1;ctx.beginPath();
 points.forEach((point,i)=>i?ctx.lineTo(point.x,point.y):ctx.moveTo(point.x,point.y));
 ctx.strokeStyle=faint?'#52766a':'#345e53';ctx.lineWidth=faint?2.5:3.5;ctx.setLineDash([3,8]);ctx.stroke();ctx.restore();
}
function drawImpact(point,faint,number){
 const x=Math.max(24,Math.min(976,point.x)),y=Math.max(35,Math.min(ground-4,point.y));
 ctx.save();ctx.globalAlpha=faint?.35:1;
 ctx.drawImage(images.ball,x-10,y-10,20,20);
 ctx.strokeStyle=faint?'#648472':'#d1784d';ctx.lineWidth=2;ctx.setLineDash([]);ctx.beginPath();ctx.arc(x,y,17,0,Math.PI*2);ctx.stroke();
 ctx.fillStyle='#fffaf0';ctx.beginPath();ctx.roundRect(x-19,y-42,38,21,7);ctx.fill();ctx.fillStyle='#496d5a';ctx.textAlign='center';ctx.font='bold 12px system-ui';ctx.fillText('#'+number,x,y-27);ctx.restore();
}
function finish(hit){
 flying=false;won=hit;angle.disabled=false;power.disabled=false;
 const result=hit?'명중':missReason();history[0].result=result;renderHistory();
 fire.disabled=hit;fire.textContent=hit?'명중! 다음 도전을 골라 주세요':'다시 발사!';
 document.getElementById('hit-actions').hidden=!hit;
 if(hit){totalHits++;updateScores();celebrate();status.textContent=attempts+'번째 시도에 명중! 같은 표적 또는 새 표적에 도전해 보세요.';}
 else status.textContent=result+'. 각도와 힘을 바꿔 다시 도전해 보세요.';
}function draw(){
 ctx.clearRect(0,0,1000,560);if(!ready)return;
 ctx.drawImage(images.background,0,0,1000,560);
 // Sprite artwork, not geometric stand-ins.
  ctx.save();ctx.translate(target.x,target.y+65);ctx.rotate(Math.sin(shakeTime*65)*shakeTime*.12);ctx.drawImage(images.target,-65,-133,130,145);ctx.restore();
 ctx.drawImage(images.cannon,35,332,185,133);
 if(!flying){const rad=Number(angle.value)*Math.PI/180;ctx.save();ctx.strokeStyle='#517b72aa';ctx.lineWidth=3;ctx.setLineDash([4,9]);ctx.beginPath();ctx.moveTo(origin.x,origin.y);ctx.lineTo(origin.x+82*Math.cos(rad),origin.y-82*Math.sin(rad));ctx.stroke();ctx.restore();}
 if(previousShot){drawPath(previousShot.trail,true);drawImpact(previousShot.impact,true,previousShot.number);}
 drawPath(trail,false);
 if(shot&&!flying)drawImpact(shot,false,attempts);
 if(shot&&flying)ctx.drawImage(images.ball,shot.x-12,shot.y-12,24,24);
 if(won){ctx.save();ctx.fillStyle='#fff9e8ed';ctx.beginPath();ctx.roundRect(385,65,230,65,20);ctx.fill();ctx.fillStyle='#b36e3d';ctx.font='bold 30px system-ui';ctx.textAlign='center';ctx.font='bold 23px system-ui';ctx.fillText(attempts+'번째 시도에 명중!',500,109);ctx.restore();}
}
function frame(time){const dt=lastTime===undefined?0:Math.min((time-lastTime)/1000,.05);lastTime=time;
 if(flying){shot.t+=dt;const next=trajectory(shot.angle,shot.power,shot.t);const hit=segmentHit(shot,next);shot.x=next.x;shot.y=next.y;trail.push({x:shot.x,y:shot.y});if(hit)finish(true);else if(shot.y>=ground-10||shot.x>1020||shot.t>8)finish(false);}
 shakeTime=Math.max(0,shakeTime-dt);
 particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=220*dt;p.rotation+=p.spin*dt;p.life-=dt;});particles=particles.filter(p=>p.life>0);
 draw();drawConfetti();requestAnimationFrame(frame);
}
[angle,power].forEach(input=>input.addEventListener('input',()=>{document.getElementById('angle-value').textContent=angle.value+'°';document.getElementById('power-value').textContent=power.value;}));
fire.addEventListener('click',()=>{if(!ready||flying||won)return;if(shot){previousShot={trail:trail.map(point=>({...point})),impact:{x:shot.x,y:shot.y},number:attempts};}
attempts++;history.unshift({number:attempts,angle:Number(angle.value),power:Number(power.value),result:'비행 중'});history=history.slice(0,3);renderHistory();document.getElementById('attempts').textContent=attempts;flying=true;won=false;trail=[{...origin}];shot={...origin,t:0,angle:Number(angle.value),power:Number(power.value)};lastTime=undefined;fire.disabled=true;angle.disabled=true;power.disabled=true;fire.textContent='날아가는 중…';status.textContent='포탄이 날아갑니다!';});
document.getElementById('same-target').addEventListener('click',()=>{if(!won)return;won=false;particles=[];shakeTime=0;fire.disabled=false;fire.textContent='다시 발사!';document.getElementById('hit-actions').hidden=true;status.textContent='같은 표적에 다시 도전해 보세요.';fire.focus();});
document.getElementById('new-target').addEventListener('click',()=>{if(won){relocateTarget();fire.focus();}});
document.getElementById('restart').addEventListener('click',()=>{totalHits=0;target.x=825;angle.value='45';power.value='70';document.getElementById('angle-value').textContent='45°';document.getElementById('power-value').textContent='70';clearRound();status.textContent='처음부터 다시! 각도와 힘을 정하고 발사해 보세요.';});
Promise.all(Object.entries(assetData).map(([name,src])=>new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{images[name]=img;resolve();};img.onerror=reject;img.src=src;}))).then(()=>{ready=true;fire.disabled=false;document.getElementById('loading').hidden=true;document.getElementById('loading').style.display='none';status.textContent='각도와 힘을 정하고 발사해 보세요.';}).catch(()=>{document.getElementById('loading').textContent='그림을 불러오지 못했어요. 페이지를 다시 열어 주세요.';});
requestAnimationFrame(frame);
</script></body></html>
