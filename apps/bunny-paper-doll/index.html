<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>원목 벽의 동물 친구들</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e4d4bb;color:#67513d;font-family:'Malgun Gothic',system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:22px 30px;background:#faf3e5;box-shadow:0 2px 10px #65432615;position:relative;z-index:10000}h1{margin:0 0 7px;font-size:23px;font-weight:500}p{margin:0;font-size:13px;color:#998169}button{border:1px solid #c9b694;border-radius:999px;padding:11px 18px;background:#fffaf0;color:#775c41;font:14px 'Malgun Gothic',system-ui,sans-serif;cursor:pointer}button:focus-visible{outline:3px solid #8d9d7a;outline-offset:4px}#desk{position:relative;height:calc(100svh - 110px);min-height:480px;overflow:hidden;background:repeating-linear-gradient(1deg,transparent 0 5px,#ac7d4310 6px,transparent 7px 14px),repeating-linear-gradient(90deg,#e7cfa8 0px,#dfc299 239px,#b9936925 240px,#e5cba4 242px,#e7cfa8 480px);box-shadow:inset 0 12px 28px #8e65331c;touch-action:none}.paper{position:absolute;width:60%;height:70%;left:20%;top:13%;background:#fffaf0;transform:rotate(-3deg);box-shadow:0 6px 15px #67482318;pointer-events:none}.doll{position:absolute;width:clamp(100px,19vw,220px);height:clamp(170px,31vw,345px);padding:0;border:0;border-radius:0;background:transparent;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}.doll img{width:100%;height:100%;object-fit:contain;pointer-events:none;filter:drop-shadow(2px 5px 2px #674c3020);transition:filter .15s}.doll.dragging{cursor:grabbing}.doll.dragging img{filter:drop-shadow(6px 12px 5px #674c3033)}.doll:focus-visible{outline:2px dashed #8d9d7a;outline-offset:3px}footer{padding:12px 25px;background:#faf3e5;font-size:12px;color:#8c775e}@media(max-width:500px){header{padding:18px}h1{font-size:20px}#desk{height:70svh}.paper{width:82%;left:9%}}
nav{display:flex;gap:8px;flex-wrap:wrap}#reset{background:#827057;color:white}#desk{background:#dfc5a0 url("art-e7eb3d1684c1fd04.webp") center/cover}header{isolation:isolate}
</style></head><body>
<header><div><h1>원목 벽의 동물 친구들</h1><p>친구들을 잡아 끌어, 마음 가는 곳에 놓아 보세요.</p></div><nav aria-label="인형 추가"><button data-animal="0" type="button">토끼</button><button data-animal="1" type="button">고양이</button><button data-animal="2" type="button">곰</button><button data-animal="3" type="button">여우</button><button id="reset" type="button">정리</button></nav></header>
<main id="desk" aria-label="동물 종이 인형을 배치하는 책상"></main>
<footer id="notice">인형을 누르면 맨 앞으로 와요. 키보드로는 탭으로 선택하고 방향키로 옮길 수 있어요.</footer>
<script>const assets=["art-bb2ed906a964048e.webp","art-4293569968c2d7ee.webp","art-7714c27eb5d4cc0b.webp","art-757862d0b119aa75.webp"];
const desk=document.getElementById('desk');
const names=['토끼','고양이','곰','여우'];
const key='paper-doll-wall-v2';
let dolls=[],highest=4,active=null;
function defaults(){dolls=names.map((_,type)=>({type,x:.08+type*.21,y:.23+(type%2)*.13,z:type+1}));highest=4;}
try{const data=JSON.parse(localStorage.getItem(key)||'null');if(Array.isArray(data)&&data.length&&data.every(p=>p&&Number.isInteger(p.type)&&p.type>=0&&p.type<4&&Number.isFinite(p.x)&&Number.isFinite(p.y)&&Number.isFinite(p.z)))dolls=data;}catch{}
if(!dolls.length)defaults();
highest=Math.max(4,...dolls.map(p=>p.z));
function save(){try{localStorage.setItem(key,JSON.stringify(dolls));}catch{document.getElementById('notice').textContent='현재 창에서 배치를 즐길 수 있어요. 브라우저에 저장하지 못했습니다.';}}
function place(button,p){const mx=Math.max(0,desk.clientWidth-button.offsetWidth),my=Math.max(0,desk.clientHeight-button.offsetHeight);p.x=Math.max(0,Math.min(1,p.x));p.y=Math.max(0,Math.min(1,p.y));button.style.left=p.x*mx+'px';button.style.top=p.y*my+'px';button.style.zIndex=p.z;}
function move(button,p,x,y){const mx=Math.max(0,desk.clientWidth-button.offsetWidth),my=Math.max(0,desk.clientHeight-button.offsetHeight);p.x=mx?Math.max(0,Math.min(mx,x))/mx:0;p.y=my?Math.max(0,Math.min(my,y))/my:0;place(button,p);}
function finish(){if(!active)return;active.button.classList.remove('dragging');active=null;save();}
function mount(p){
 const button=document.createElement('button');button.className='doll';button.type='button';button.setAttribute('aria-label',names[p.type]+' 인형, 끌어서 이동');button.dollData=p;
 const img=document.createElement('img');img.src=assets[p.type];img.alt='';img.draggable=false;button.append(img);desk.append(button);
 button.addEventListener('pointerdown',event=>{if(event.button!==0||active)return;event.preventDefault();button.focus({preventScroll:true});p.z=++highest;place(button,p);const rect=button.getBoundingClientRect();active={button,dx:event.clientX-rect.left,dy:event.clientY-rect.top,id:event.pointerId};button.setPointerCapture(event.pointerId);button.classList.add('dragging');});
 button.addEventListener('pointermove',event=>{if(!active||active.button!==button||active.id!==event.pointerId)return;const rect=desk.getBoundingClientRect();move(button,p,event.clientX-rect.left-active.dx,event.clientY-rect.top-active.dy);});
 ['pointerup','pointercancel','lostpointercapture'].forEach(type=>button.addEventListener(type,finish));
 button.addEventListener('keydown',event=>{const delta={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[event.key];if(!delta)return;event.preventDefault();p.z=++highest;const step=event.shiftKey?25:8;move(button,p,button.offsetLeft+delta[0]*step,button.offsetTop+delta[1]*step);save();});
 place(button,p);return button;
}
function render(){desk.replaceChildren();dolls.forEach(mount);}
render();
document.querySelectorAll('[data-animal]').forEach(button=>button.addEventListener('click',()=>{
 const p={type:Number(button.dataset.animal),x:.15+Math.random()*.65,y:.12+Math.random()*.6,z:++highest};dolls.push(p);mount(p);save();
 document.getElementById('notice').textContent=names[p.type]+' 한 마리가 더 왔어요. 총 '+dolls.length+'마리 · 잡아 끌어 옮겨 보세요.';
}));
document.getElementById('reset').addEventListener('click',()=>{finish();defaults();render();save();document.getElementById('notice').textContent='정리했어요. 처음 네 마리로 돌아왔습니다.';});
window.addEventListener('blur',finish);
window.addEventListener('resize',()=>{finish();document.querySelectorAll('.doll').forEach(button=>place(button,button.dollData));});</script></body></html>
