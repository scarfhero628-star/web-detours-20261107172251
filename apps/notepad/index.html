<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f3ec"><title>카세트 메모장</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f3ec;color:#49463d;font-family:'Malgun Gothic',system-ui,sans-serif}main{width:min(100% - 40px,800px);margin:0 auto;padding:60px 0 32px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px}h1{font-size:26px;margin:0;font-weight:500;letter-spacing:-.04em}.intro{font-size:13px;color:#979080;margin:10px 0 0}button{font:14px 'Malgun Gothic',system-ui,sans-serif;background:#e8e2d5;color:#766952;border:0;border-radius:10px;padding:11px 17px;cursor:pointer;white-space:nowrap}button:hover{background:#dfd6c5}button:disabled{opacity:.45;cursor:default}textarea{display:block;width:100%;min-height:60vh;resize:vertical;border:1px solid #e3ddcf;border-radius:16px;background:#fffdf7;color:#49463d;padding:26px;font:17px/1.95 'Malgun Gothic',system-ui,sans-serif;box-shadow:0 8px 35px #82734e08}textarea::placeholder{color:#b4ad9c}textarea:focus-visible,button:focus-visible{outline:2px solid #b2aa8e;outline-offset:4px}.footer{display:flex;justify-content:space-between;gap:20px;font-size:12px;color:#978e7b;margin-top:15px}#status{margin:0;line-height:1.7}#count{white-space:nowrap}@media(max-width:500px){main{padding-top:34px}textarea{padding:20px;font-size:16px}}
body{background:#302e2a;color:#e9dfc8}main{background:#47453f;border:2px solid #666258;border-radius:24px;margin:35px auto;padding:26px;box-shadow:0 16px 50px #0005;position:relative}
h1{color:#eee4ca}.intro{color:#c2b697}header{border-bottom:5px solid #c17b47;padding-bottom:20px}textarea{min-height:36vh;border-radius:5px;background:#eee3c7;border:2px solid #aca184;color:#494335;font-family:Consolas,'Malgun Gothic',monospace;box-shadow:inset 0 2px 7px #0002}.footer{color:#d0c4a6}.cassette{margin:5px 0 22px;border:2px solid #262724;background:#272925;border-radius:35px;display:flex;align-items:center;justify-content:space-around;padding:15px;position:relative}.reel{width:62px;height:62px;border:9px solid #a99e84;border-radius:50%;background:repeating-conic-gradient(#282a25 0deg 35deg,#d8c9a6 35deg 60deg);box-shadow:0 0 0 5px #171a17;position:relative}.reel::after{content:'';position:absolute;inset:13px;border-radius:50%;background:#292b26}.tape-label{color:#cabe9f;font:12px/1.8 Consolas,monospace;letter-spacing:.12em;text-align:center}.rewinding .reel{animation:rewind .45s linear infinite}@keyframes rewind{to{transform:rotate(-360deg)}}.transport{display:flex;justify-content:center;gap:12px;margin-top:20px}#rewind{background:#c5b99a;color:#302e28;border-bottom:4px solid #93866c;touch-action:none;user-select:none;-webkit-user-select:none}#rewind:active,#rewind.held{background:#dfb17f;transform:translateY(2px);border-bottom-width:2px}#rewind:disabled{opacity:.4;cursor:default}.rewind-hint{text-align:center;font-size:12px;color:#bbad8e;margin:12px 0 0}button{border-radius:5px}button:focus-visible{outline-color:#f2bb7d}@media(max-width:500px){main{padding:20px;margin-top:20px}.reel{width:48px;height:48px;border-width:7px}.reel::after{inset:9px}}@media(prefers-reduced-motion:reduce){.rewinding .reel{animation:none}}
body{background:#eee0d5;color:#674c43}main{background:#dba98e;border-color:#bc8e78;box-shadow:0 16px 50px #80534426}h1{color:#543f38}.intro{color:#705247}header{border-bottom-color:#f6d5bd}.cassette{background:#765d56;border-color:#634c45}.reel{border-color:#f1d5b8;background:repeating-conic-gradient(#70584f 0deg 35deg,#fff0d8 35deg 60deg);box-shadow:0 0 0 5px #614c44}.reel::after{background:#765d56}.tape-label{color:#ffe6ce}#rewind{background:#f5dfc5;color:#6e4d42;border-bottom-color:#bd937b}#rewind.held,#rewind:active{background:#ffe9b5}.footer,.rewind-hint{color:#6f5045}.rewinding .reel{animation-duration:.75s}
</style>
</head>
<body><main>
<header><div><h1>카세트 메모장</h1><p class="intro">SIDE A · 오늘의 생각을 녹음하듯.</p></div><button id="clear" type="button">모두 지우기</button></header>
<div class="cassette" aria-hidden="true"><div class="reel"></div><div class="tape-label">MEOW TAPE<br>SIDE A · CAT MIX</div><div class="reel"></div></div>
<textarea id="note" aria-label="메모 내용" placeholder="여기에 글을 적어 보세요." spellcheck="false"></textarea>
<div class="footer"><p id="status" role="status" aria-live="polite">이 브라우저에 자동으로 저장돼요.</p><span id="count">0자</span></div>
<div class="transport"><button id="rewind" type="button">◀◀ 야옹 되감기</button></div><p class="rewind-hint">누르고 있으면 야옹, 글도 뒤로 사라져요.</p>
</main><script>
const key='little-notepad-v1';
const note=document.getElementById('note');
const status=document.getElementById('status');
const clear=document.getElementById('clear');
function update(){document.getElementById('count').textContent=Array.from(note.value).length.toLocaleString()+'자';clear.disabled=note.value.length===0;document.getElementById('rewind').disabled=note.value.length===0;}
try{note.value=localStorage.getItem(key)||'';}catch{status.textContent='저장소를 사용할 수 없어요. 현재 창에서만 메모할 수 있습니다.';}
function save(){
  try{localStorage.setItem(key,note.value);status.textContent=note.value?'저장됐어요 · 이 브라우저에 보관됩니다.':'이 브라우저에 자동으로 저장돼요.';}
  catch{status.textContent='저장하지 못했어요. 창을 닫기 전에 내용을 복사해 주세요.';}
  update();
}
const rewind=document.getElementById('rewind');
let rewindTimer, rewinding=false;
const segmenter=typeof Intl.Segmenter==='function' ? new Intl.Segmenter('ko',{granularity:'grapheme'}) : null;
let tapeAudio, tapeSound;
function stopTapeSound(){
  clearInterval(meowTimer);
  if(!tapeSound)return;
  const sound=tapeSound;tapeSound=null;
  // Disconnect immediately so releasing the button silences every source.
  sound.gain.disconnect();
  for(const source of sound.sources){try{source.stop();}catch{} source.disconnect();}
  sound.filter.disconnect();
}
let meowTimer;
function startTapeSound(){
  try{
    const Audio=window.AudioContext||window.webkitAudioContext;
    if(!Audio)return;
    tapeAudio ||= new Audio();
    stopTapeSound();
    const ctx=tapeAudio;
    const gain=ctx.createGain();gain.gain.value=.16;gain.connect(ctx.destination);
    const filter=ctx.createBiquadFilter();filter.type='bandpass';filter.frequency.value=1250;filter.Q.value=1.8;filter.connect(gain);
    const sound={gain,filter,sources:[]};tapeSound=sound;
    function meow(){
      if(!rewinding || tapeSound!==sound)return;
      const time=ctx.currentTime;
      const voice=ctx.createOscillator(), envelope=ctx.createGain();
      voice.type='sawtooth';
      voice.frequency.setValueAtTime(530,time);
      voice.frequency.exponentialRampToValueAtTime(790,time+.13);
      voice.frequency.exponentialRampToValueAtTime(420,time+.53);
      filter.frequency.setValueAtTime(1650,time);
      filter.frequency.exponentialRampToValueAtTime(680,time+.55);
      envelope.gain.setValueAtTime(0,time);
      envelope.gain.linearRampToValueAtTime(.6,time+.07);
      envelope.gain.setValueAtTime(.45,time+.23);
      envelope.gain.exponentialRampToValueAtTime(.001,time+.6);
      voice.connect(envelope);envelope.connect(filter);
      sound.sources.push(voice);voice.start(time);voice.stop(time+.62);
      voice.onended=()=>{voice.disconnect();envelope.disconnect();sound.sources=sound.sources.filter(source=>source!==voice);};
    }
    ctx.resume().then(()=>{
      if(!rewinding || tapeSound!==sound)return;
      meow();meowTimer=setInterval(meow,850);
    }).catch(stopTapeSound);
  }catch{stopTapeSound();}
}function stopRewind(){
  stopTapeSound();
  clearInterval(rewindTimer);rewindTimer=undefined;rewinding=false;
  document.body.classList.remove('rewinding');rewind.classList.remove('held');
  note.readOnly=false;
}
function eraseLast(){
  if(!note.value){stopRewind();return;}
  const characters=segmenter ? Array.from(segmenter.segment(note.value),part=>part.segment) : Array.from(note.value);
  characters.pop();note.value=characters.join('');
  note.setSelectionRange(note.value.length,note.value.length);note.scrollTop=note.scrollHeight;
  save();if(!note.value)stopRewind();
}
function beginRewind(){
  if(rewinding || !note.value)return;
  rewinding=true;note.readOnly=true;startTapeSound();
  document.body.classList.add('rewinding');rewind.classList.add('held');
  eraseLast();if(rewinding)rewindTimer=setInterval(eraseLast,105);
}
rewind.addEventListener('pointerdown',event=>{
  if(event.button!==0)return;
  event.preventDefault();rewind.focus();rewind.setPointerCapture(event.pointerId);beginRewind();
});
['pointerup','pointercancel','lostpointercapture'].forEach(type=>rewind.addEventListener(type,stopRewind));
window.addEventListener('pointerup',stopRewind);
rewind.addEventListener('keydown',event=>{
  if(event.code==='Space' || event.code==='Enter'){event.preventDefault();if(!event.repeat)beginRewind();}
});
rewind.addEventListener('keyup',event=>{if(event.code==='Space' || event.code==='Enter'){event.preventDefault();stopRewind();}});
rewind.addEventListener('blur',stopRewind);
window.addEventListener('blur',stopRewind);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopRewind();});
note.addEventListener('input',save);
clear.addEventListener('click',()=>{
  if(!note.value || !confirm('메모 내용을 모두 지울까요?'))return;
  note.value='';save();note.focus();
});
update();
</script></body></html>
