<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#b9b6d5">
  <title>하루의 빛</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: #b9b6d5; }
  </style>
</head>
<body>
  <script>
    // Local computer time; the last stop joins the next day's midnight.
    const stops = [
      [0, [166, 162, 194]],
      [4, [189, 181, 211]],
      [6, [219, 204, 229]],
      [8, [245, 218, 228]],
      [12, [239, 235, 224]],
      [15, [218, 235, 230]],
      [17, [206, 226, 237]],
      [18.5, [220, 214, 235]],
      [20, [205, 191, 219]],
      [22, [182, 173, 204]],
      [24, [166, 162, 194]]
    ];
    const theme = document.querySelector('meta[name="theme-color"]');
    function updateColor() {
      const now = new Date();
      const hour = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600 + now.getMilliseconds() / 3600000;
      const index = stops.findIndex((stop, i) => i < stops.length - 1 && hour >= stop[0] && hour < stops[i + 1][0]);
      const [startHour, startColor] = stops[index];
      const [endHour, endColor] = stops[index + 1];
      const progress = (hour - startHour) / (endHour - startHour);
      const smooth = progress * progress * (3 - 2 * progress);
      const color = startColor.map((channel, i) => channel + (endColor[i] - channel) * smooth);
      const cssColor = `rgb(${color.map(channel => channel.toFixed(3)).join(', ')})`;
      document.body.style.backgroundColor = cssColor;
      theme.content = '#' + color.map(channel => Math.round(channel).toString(16).padStart(2, '0')).join('');
    }
    updateColor();
    setInterval(updateColor, 1000);
    document.addEventListener('visibilitychange', updateColor);
    window.addEventListener('focus', updateColor);
  </script>
</body>
</html>
