<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7faf7">
  <meta name="description" content="쉬는 틈에 만든 작은 웹앱들. 마음을 돌보고, 잠깐 놀고, 일상을 가볍게 만드는 딴짓 모음.">
  <title>딴짓 수집함</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: light; --ink: #242b38; --muted: #59616c; --line: #dce6dd; --paper: #f7faf7; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Malgun Gothic", system-ui, sans-serif; }
    .frame { width: min(1120px, calc(100% - 48px)); margin: auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 22px 0; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 14px; }
    .logo { display: grid; place-items: center; width: 31px; height: 31px; border-radius: 9px; background: #292b3a; color: #f9e0a6; font-size: 18px; }
    .overline { font-size: 10px; letter-spacing: .16em; font-weight: 700; color: #626677; }
    .hero { position: relative; overflow: hidden; margin: 27px 0 37px; padding: 48px 42px; border-radius: 23px; background: #e6f2e5; }
    .hero-copy { max-width: 71%; }
    .hero > * { position: relative; z-index: 1; }
    .hero h1 { font-size: clamp(39px, 7vw, 72px); letter-spacing: -.065em; line-height: 1.18; overflow-wrap: anywhere; margin: 13px 0 17px; }
    .hero p { font-size: 15px; line-height: 1.8; color: #484c62; margin: 0; word-break: keep-all; }
    .hero-art { position: absolute; z-index: 0; right: 8%; top: 50%; transform: translateY(-50%) rotate(-12deg); display: grid; place-items: center; width: 174px; aspect-ratio: 1; border-radius: 50%; border: 1px solid #a6bea9; color: #326049; font-size: 104px; background: #f9e0a6; box-shadow: 15px 13px 0 #bfdbc9; }
    .heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    h2 { margin: 0; font-size: 22px; letter-spacing: -.04em; }
    #results { margin: 0; color: var(--muted); font-size: 12px; }
    .toolbar { display: flex; justify-content: space-between; gap: 12px; margin: 15px 0 20px; align-items: center; flex-wrap: wrap; }
    #filters { display: flex; gap: 6px; flex-wrap: wrap; }
    button, input { font: inherit; }
    button { border: 1px solid var(--line); background: #ffffff; color: var(--ink); border-radius: 999px; padding: 8px 14px; font-size: 12px; cursor: pointer; }
    button[aria-pressed="true"] { background: var(--ink); color: white; border-color: var(--ink); }
    input { width: min(100%, 236px); padding: 10px 12px; border: 1px solid var(--line); background: #ffffff; color: var(--ink); border-radius: 10px; font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
    .card { display: flex; flex-direction: column; min-width: 0; background: #ffffff; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; text-decoration: none; color: inherit; transition: transform .17s, box-shadow .17s; }
    .card:hover { transform: translateY(-3px); box-shadow: 0 7px 18px #23203812; }
    .art { position: relative; display: grid; place-items: center; overflow: hidden; min-height: 105px; background: #e8e3f7; color: #5e508a; }
    .art::before { content: ""; position: absolute; width: 95px; height: 95px; border: 1px solid currentColor; border-radius: 50%; opacity: .21; transform: translate(39px,20px); }
    .art span { font-size: 45px; line-height: 1; position: relative; }
    .art img { position: relative; width: 100%; height: 105px; object-fit: contain; padding: 7px 18px; }
    .peach { background: #f5e0d8; color: #934f44; } .sage { background: #dfeadf; color: #3f6d51; } .sand { background: #f6eacb; color: #836429; }
    .card-copy { display: flex; flex-direction: column; align-items: flex-start; flex: 1; gap: 7px; padding: 15px; }
    .category { color: #535b69; font-size: 10px; font-weight: 700; letter-spacing: .07em; }
    h3 { font-size: 16px; letter-spacing: -.035em; margin: 0; line-height: 1.45; word-break: keep-all; }
    .card p { margin: 0 0 7px; color: var(--muted); font-size: 12px; line-height: 1.65; word-break: keep-all; }
    .launch { margin-top: auto; font-size: 11px; font-weight: 700; color: #474370; }
    #empty { margin: 0; padding: 36px 16px; text-align: center; color: var(--muted); }
    footer { border-top: 1px solid var(--line); color: var(--muted); margin-top: 42px; padding: 20px 0 35px; font-size: 12px; }
    :focus-visible { outline: 3px solid #6454ab; outline-offset: 4px; }
    @media (max-width: 860px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 650px) {
      .frame { width: calc(100% - 32px); } .hero { padding: 28px 23px; margin-top: 18px; } .hero-art { right: -42px; opacity: .2; } .hero p { font-size: 13px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; } .card-copy { padding: 12px; } .art, .art img { height: 86px; min-height: 86px; }
    }
    @media (max-width: 350px) { .grid { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
    .featured { margin-bottom: 40px; }
    .featured-heading { margin-bottom: 16px; }
    .featured-heading p { margin: 7px 0 0; color: var(--muted); font-size: 13px; }
    .featured-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .featured-grid .art { height: 170px; }
    .featured-grid .art img { height: 170px; padding: 12px 24px; }
    .featured-grid .art span { font-size: 69px; }
    .featured-grid .card-copy { padding: 20px; }
    .featured-grid h3 { font-size: 20px; }
    .featured-grid .card p { font-size: 13px; }
    .collection { padding-top: 24px; border-top: 1px solid var(--line); }
    @media (max-width: 650px) {
      .hero-copy { max-width: 100%; }
      .featured-grid { grid-template-columns: 1fr; gap: 12px; }
      .featured-grid .card { display: grid; grid-template-columns: 32% minmax(0, 1fr); }
      .featured-grid .art { height: 100%; min-height: 126px; }
      .featured-grid .art img { height: 126px; padding: 8px; }
      .featured-grid .art span { font-size: 49px; }
      .featured-grid .card-copy { padding: 16px; }
      .featured-grid h3 { font-size: 17px; }
    }
  </style>
  <script src="projects.js" defer></script>
  <script src="portfolio.js" defer></script>
</head>
<body>
  <div class="frame">
    <header><div class="brand"><span class="logo" aria-hidden="true">✷</span>딴짓 수집함</div><span class="overline">A LITTLE WEB COLLECTION</span></header>
    <main>
      <section class="hero" aria-labelledby="title">
        <div class="hero-art" aria-hidden="true">✷</div>
        <div class="hero-copy">
          <span class="overline">작은 웹앱을 만들어요</span>
          <h1 id="title">딴짓 수집함</h1>
          <p id="intro">마음을 돌보고 일상을 가볍게 하는 작은 웹앱을 만들어요.</p>
        </div>
      </section>
      <section class="featured" id="featured" aria-labelledby="featured-title" hidden>
        <div class="featured-heading"><h2 id="featured-title">먼저 펼쳐 볼 딴짓</h2><p>이곳을 처음 열었다면, 이 작품들부터 둘러보세요.</p></div>
        <div class="featured-grid" id="featured-cards"></div>
      </section>
      <section class="collection" aria-labelledby="collection">
        <div class="heading"><h2 id="collection">더 많은 딴짓</h2><p id="results" role="status"></p></div>
        <div class="toolbar"><div id="filters" aria-label="분류"></div><input id="search" type="search" aria-label="딴짓 검색" placeholder="제목이나 소개로 검색"></div>
        <div class="grid" id="cards"></div>
        <p id="empty" hidden>조건에 맞는 딴짓이 없어요.</p>
        <noscript>카드 목록을 보려면 브라우저에서 자바스크립트를 켜 주세요.</noscript>
      </section>
    </main>
    <footer>틈틈이 만든 작은 웹앱들을 한곳에.</footer>
  </div>
</body>
</html>
